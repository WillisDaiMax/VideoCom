name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Unit tests
        working-directory: core
        run: python3 -m unittest discover -s tests -v

  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"; fi
      - name: Build app
        working-directory: app
        run: ./build_app.sh "${{ steps.v.outputs.version }}"
      - name: Make dmg
        working-directory: app
        run: ./make_dmg.sh "${{ steps.v.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: VideoCom-${{ steps.v.outputs.version }}
          path: app/build/VideoCom-*.dmg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/VideoCom-*.dmg
          generate_release_notes: true
